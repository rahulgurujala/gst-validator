name: Release

# The filename and the `pypi` environment below are part of the PyPI Trusted
# Publisher configuration. Renaming either breaks publishing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release mid-flight: two pushes landing close together would
# otherwise race release-please against itself over the same tag, and could
# interrupt a publish between the upload and the release assets. Queue instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release pull request up to date from Conventional Commits. Merging
  # it bumps the version, writes the changelog, tags and creates the release.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps pyproject.toml and __version__, but knows nothing
  # about uv.lock, which records this project's own version too. Without this
  # the release PR would merge a lockfile one version behind and every
  # `uv sync --locked` against main would fail.
  lockfile:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Refresh the lockfile for the new version
        run: uv lock

      - name: Commit it to the release pull request
        run: |
          if [ -z "$(git status --porcelain uv.lock)" ]; then
            echo "lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv.lock for the release"
          git push

  build:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Verify the tag matches the project version
        run: |
          tag="${{ needs.release-please.outputs.tag }}"
          version="$(uv version --short)"
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::tag $tag does not match pyproject version $version"
            exit 1
          fi

      # The same gate as CI, so nothing can be published that CI would have
      # stopped. Keep these two lists in step.
      - name: Test before publishing
        run: |
          uv lock --check
          uv sync --locked --all-extras --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pyright
          uv run pytest -q

      - name: Build
        run: uv build

      # CI runs this too. Without it the claim above is not quite true: a
      # README that will not render on PyPI would reach the upload.
      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for PyPI Trusted Publishing
    env:
      # Secrets cannot be read directly in an `if:`, so surface it here.
      HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish with Trusted Publishing (no secret needed)
        if: env.HAS_TOKEN != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish with an API token
        if: env.HAS_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  attach-artifacts:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Attach the built files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
