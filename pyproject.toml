[project]
name = "gst-validator"
version = "0.5.0"
description = "Validate Indian GSTINs offline, in bulk, and fetch taxpayer details from the GST portal"
readme = "README.md"
authors = [
    { name = "rahulgurujala", email = "isaacnewtonrahul@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = [
    "gst",
    "gstin",
    "gstin-validator",
    "gst-api",
    "india",
    "indian",
    "tax",
    "taxation",
    "taxpayer",
    "compliance",
    "fintech",
    "validator",
    "validation",
    "cli",
    "async",
    "httpx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/rahulgurujala/gst-validator"
Repository = "https://github.com/rahulgurujala/gst-validator"
Documentation = "https://github.com/rahulgurujala/gst-validator#readme"
Changelog = "https://github.com/rahulgurujala/gst-validator/blob/main/CHANGELOG.md"
Releases = "https://github.com/rahulgurujala/gst-validator/releases"
Issues = "https://github.com/rahulgurujala/gst-validator/issues"

[project.scripts]
gst-validator = "gst_validator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on an unknown marker or a malformed config rather than ignoring it, and
# treat warnings as errors so a deprecation in a dependency surfaces here
# first rather than breaking a release later.
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
