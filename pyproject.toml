[project]
name = "gst-validator"
version = "0.1.0"
description = "Validate GSTINs and fetch taxpayer details from the Indian GST portal"
readme = "README.md"
authors = [
    { name = "rahulgurujala", email = "isaacnewtonrahul@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
gst-validator = "gst_validator.cli:main"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
